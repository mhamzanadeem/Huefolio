name: Huefolio QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install backend dependency
        run: npm --prefix backend install --omit=dev --no-audit --no-fund
      - run: npm test
      - run: npm run test:backend
      - run: npm --prefix backend run check
      - run: npm run check:release
      - name: Audit production dependencies
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: Install isolated browser QA tool
        run: |
          npm install --prefix "$RUNNER_TEMP/huefolio-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/huefolio-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser journey and accessibility checks (mocked provider only)
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/huefolio-browser/node_modules/playwright
        run: npm run test:browser
